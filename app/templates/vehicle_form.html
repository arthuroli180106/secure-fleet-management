{% extends "base.html" %}{% block content %}<section class="panel narrow"><h1>Add vehicle</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>License plate<input name="plate" maxlength="16" required></label><label>Make<input name="make" maxlength="60" required></label><label>Model<input name="model" maxlength="60" required></label><label>Year<input name="year" type="number" min="1990" max="2100" required></label><label>Status<select name="status">{% for s in ['available','rented','maintenance','inactive'] %}<option>{{ s }}</option>{% endfor %}</select></label><button>Add vehicle</button></form></section>{% endblock %}
