{% extends "base.html" %}{% block content %}<section class="panel narrow"><h1>Record payment due</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Driver<select name="driver_id" required>{% for d in drivers %}<option value="{{ d.id }}">{{ d.full_name }}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Due date<input name="due_date" type="date" required></label><button>Save payment</button></form></section>{% endblock %}
