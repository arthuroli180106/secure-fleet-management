{% extends "base.html" %}{% block content %}<section class="panel narrow"><h1>Record maintenance</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Vehicle<select name="vehicle_id" required>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.plate }} · {{ v.make }} {{ v.model }}</option>{% endfor %}</select></label><label>Description<input name="description" maxlength="300" required></label><label>Cost<input name="cost" type="number" min="0" step="0.01" required></label><label>Service date<input name="service_date" type="date" required></label><button>Save maintenance</button></form></section>{% endblock %}
