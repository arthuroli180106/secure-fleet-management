{% extends "base.html" %}{% block title %}Sign in | Secure Fleet{% endblock %}
{% block content %}
<section class="panel narrow"><h1>Sign in</h1><p>Authorized OliverWay personnel only.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email<input type="email" name="email" maxlength="254" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button type="submit">Sign in</button>
</form></section>
{% endblock %}
